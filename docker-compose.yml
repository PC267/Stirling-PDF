services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "1003:1003"  # 宿主机1003映射到容器内部1003
    volumes:
      - ./config:/configs
    environment:
      TZ: Asia/Shanghai
      SYSTEM_DEFAULTLOCALE: zh-CN
      SECURITY_ENABLELOGIN: "true"
      SYSTEM_ENABLEANALYTICS: "false"
      SERVER_PORT: 1003  # 👈 核心修改：强制应用内部监听 1003 端口
      SECURITY_LOGINATTEMPTCOUNT: "10"      # 将尝试次数改为10次
      SECURITY_LOGINRESETTIMEMINUTES: "30"  # 将锁定时长改为30分钟